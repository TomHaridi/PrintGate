<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0C8B80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PrintGate">
<meta name="format-detection" content="telephone=no">
<title>PrintGate 云打印</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ─────────── 登录 ─────────── -->
<div id="login" class="login hidden">
  <div class="login-head">
    <img class="login-logo" src="icon.png" alt="PrintGate">
    <h1>PrintGate 云打印</h1>
    <p class="login-sub">登录后可上传文件、选择打印机并提交打印</p>
  </div>

  <form id="login-form" class="card login-card" autocomplete="on">
    <label class="field">
      <span>用户名</span>
      <input id="lg-user" name="username" type="text" inputmode="text" autocapitalize="none"
             autocorrect="off" spellcheck="false" placeholder="管理员分配的用户名" required>
    </label>
    <label class="field">
      <span>密码</span>
      <input id="lg-pass" name="password" type="password" placeholder="登录密码" required>
    </label>
    <button id="lg-submit" class="btn btn-primary btn-block" type="submit">登录</button>
    <p id="lg-msg" class="login-msg"></p>
  </form>

  <p class="login-foot">
    还没有账号？请联系管理员在后台「用户管理」里开通；<br>
    也可以直接用管理员账号登录。
  </p>
  <p class="login-ver" id="lg-ver"></p>
</div>

<!-- ─────────── 主界面 ─────────── -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="topbar-title" id="tb-title">打印</div>
        <div class="topbar-sub" id="tb-sub"></div>
      </div>
      <button class="icon-btn" id="tb-refresh" title="刷新">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="views">
    <!-- 打印 -->
    <section id="v-print" class="view">
      <div class="card">
        <div class="card-head">
          <h2>选择文件</h2>
          <button class="text-btn hidden" id="clear-file">清除</button>
        </div>

        <div id="pick-empty" class="pick">
          <button class="btn btn-primary btn-block" id="btn-pick">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11A2.5 2.5 0 0 0 20 18.5V15"/>
            </svg>
            选择文件
          </button>
          <div class="pick-row">
            <button class="btn btn-ghost" id="btn-camera">拍照</button>
            <button class="btn btn-ghost" id="btn-photos">从相册选</button>
          </div>
          <p class="tip">支持 PDF / Word / Excel / PPT / 图片，可多选；多张图片会合成一份多页 PDF</p>
        </div>

        <div id="pick-file" class="file-card hidden">
          <div class="thumb"><img id="thumb-img" alt=""></div>
          <div class="file-meta">
            <div class="file-name" id="file-name">—</div>
            <div class="file-sub" id="file-sub">—</div>
            <div class="pager hidden" id="pager">
              <button class="pg-btn" id="pg-prev">‹</button>
              <span id="pg-label">1 / 1</span>
              <button class="pg-btn" id="pg-next">›</button>
            </div>
          </div>
          <button class="text-btn" id="btn-change">更换</button>
        </div>

        <div id="upload-bar" class="upload hidden">
          <div class="upload-track"><div class="upload-fill" id="upload-fill"></div></div>
          <div class="upload-text" id="upload-text">上传中…</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>打印设置</h2><button class="text-btn" id="toggle-adv">高级</button></div>

        <label class="row">
          <span class="row-k">打印机</span>
          <select id="opt-printer" class="row-v"></select>
        </label>
        <div class="row">
          <span class="row-k">份数</span>
          <div class="stepper">
            <button data-step="-1">−</button>
            <input id="opt-copies" type="number" min="1" max="99" value="1" inputmode="numeric">
            <button data-step="1">+</button>
          </div>
        </div>
        <label class="row">
          <span class="row-k">单双面</span>
          <select id="opt-sides" class="row-v">
            <option value="one-sided">单面</option>
            <option value="two-sided-long-edge">双面（长边翻页）</option>
            <option value="two-sided-short-edge">双面（短边翻页）</option>
          </select>
        </label>
        <div class="row">
          <span class="row-k">色彩</span>
          <div class="seg" id="opt-color">
            <button data-v="mono" class="on">黑白</button>
            <button data-v="color">彩色</button>
          </div>
        </div>

        <div id="adv" class="adv hidden">
          <label class="row">
            <span class="row-k">纸张</span>
            <select id="opt-media" class="row-v">
              <option>A4</option><option>A3</option><option>A5</option><option>A6</option>
              <option>Letter</option><option>Legal</option><option>B5</option><option>16K</option>
            </select>
          </label>
          <div class="row">
            <span class="row-k">方向</span>
            <div class="seg" id="opt-orient">
              <button data-v="portrait" class="on">纵向</button>
              <button data-v="landscape">横向</button>
            </div>
          </div>
          <label class="row">
            <span class="row-k">页码范围</span>
            <input id="opt-ranges" class="row-v" type="text" inputmode="numeric" placeholder="如 1-3,5（留空=全部）">
          </label>
          <label class="row">
            <span class="row-k">每页页数</span>
            <select id="opt-numberup" class="row-v">
              <option value="1">1 页</option><option value="2">2 页</option>
              <option value="4">4 页</option><option value="6">6 页</option><option value="9">9 页</option>
            </select>
          </label>
          <label class="row">
            <span class="row-k">水印</span>
            <input id="opt-watermark" class="row-v" type="text" maxlength="40" placeholder="可选，最多 40 字">
          </label>
        </div>
      </div>

      <button id="btn-print" class="btn btn-primary btn-block btn-lg">提交打印</button>
      <div class="pad"></div>
    </section>

    <!-- 文件 -->
    <section id="v-files" class="view hidden">
      <div id="files-list" class="list"></div>
      <div class="pad"></div>
    </section>

    <!-- 记录 -->
    <section id="v-tasks" class="view hidden">
      <div id="tasks-list" class="list"></div>
      <div class="pad"></div>
    </section>

    <!-- 我的 -->
    <section id="v-me" class="view hidden">
      <div class="card me-head">
        <div class="me-avatar" id="me-avatar">P</div>
        <div>
          <div class="me-name" id="me-name">—</div>
          <div class="me-sub" id="me-sub">—</div>
        </div>
      </div>

      <div class="card">
        <div class="row"><span class="row-k">服务地址</span><span class="row-v is-static mono ellipsis" id="me-origin">—</span></div>
        <div class="row"><span class="row-k">账号类型</span><span class="row-v is-static" id="me-type">—</span></div>
        <div class="row"><span class="row-k">审批状态</span><span class="row-v is-static" id="me-status">—</span></div>
        <div class="row"><span class="row-k">版本</span><span class="row-v is-static" id="me-version">—</span></div>
      </div>

      <div class="card">
        <button class="link-row" id="btn-pass">
          修改密码
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="link-row hidden" id="btn-server">
          服务器设置
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <button class="link-row danger" id="btn-logout">退出登录</button>
      </div>

      <p class="me-foot">PrintGate · CUPS 打印网关<br>iPhone 版由同一套 Web 界面驱动</p>
      <div class="pad"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="print" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 9V4.5h10V9"/><rect x="3.5" y="9" width="17" height="7.5" rx="2"/>
        <rect x="7" y="14" width="10" height="5.5" rx="1.2"/>
      </svg>
      <span>打印</span>
    </button>
    <button data-tab="files">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10A1.5 1.5 0 0 0 18.5 19V8z"/>
        <path d="M14 3.5V8h4.5"/>
      </svg>
      <span>文件</span>
    </button>
    <button data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
      </svg>
      <span>记录</span>
    </button>
    <button data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.5"/><path d="M4.8 20c.8-3.6 3.7-5.5 7.2-5.5s6.4 1.9 7.2 5.5"/>
      </svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<!-- ─────────── 底部弹层（改密 / 预览） ─────────── -->
<div id="sheet-mask" class="mask hidden"></div>
<div id="sheet" class="sheet hidden">
  <div class="sheet-head">
    <button class="sheet-close" id="sheet-close">关闭</button>
    <span id="sheet-title">标题</span>
    <span style="width:64px"></span>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<input id="file-input" type="file" multiple class="hidden"
       accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,application/pdf,image/*">
<input id="camera-input" type="file" accept="image/*" capture="environment" class="hidden">

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
