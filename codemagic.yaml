# Codemagic 云端 macOS 构建配置（免费额度：每月 500 分钟 M2 机器）
# 用途与 .github/workflows/flutter-ios.yml 相同：在 mac 构建机上把 Flutter 工程编成「未签名 IPA」。
# 用法：把仓库连到 Codemagic → 选这个 workflow → Start new build。
workflows:
  ios-unsigned:
    name: PrintGate iOS (unsigned IPA)
    working_directory: app
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      flutter: 3.47.9
      # 只出未签名包时不需要证书；将来要直接装进手机再加 signing 段
      # ios_signing:
      #   distribution_type: development
      #   bundle_identifier: com.printgate.app
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v

      - name: Pub get
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Unit tests
        script: flutter test

      # --no-codesign：先要一个「能装进手机再自签」的产物，不依赖开发者账号
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || { echo "找不到 $APP_PATH"; ls -R build/ios | head -50; exit 1; }
          rm -rf build/Payload build/PrintGate-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/PrintGate.app
          ( cd build && zip -qry PrintGate-unsigned.ipa Payload )
          ls -lh build/PrintGate-unsigned.ipa

    artifacts:
      - build/PrintGate-unsigned.ipa
      - build/ios/archive/**/*.xcarchive

  # ---------- 原生 SwiftUI 版（DesignFoundation）----------
  # 与 Flutter 版并行存在：二选一，互不影响。
  ios-swiftui:
    name: PrintGate SwiftUI (DesignFoundation, unsigned IPA)
    working_directory: ios-swiftui
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true
    environment:
      xcode: latest
      vars:
        SCHEME: PrintGate
    scripts:
      - name: Xcode 版本
        script: xcodebuild -version

      - name: 解析 DesignFoundation（SPM）
        script: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project PrintGate.xcodeproj -scheme "$SCHEME"

      - name: 编译（Release，未签名）
        script: |
          set -uo pipefail
          mkdir -p /tmp/xcodebuild_logs
          set +e
          xcodebuild \
            -project PrintGate.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/xcodebuild_logs/build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "xcodebuild 退出码 = $RC"
          # 编译失败时把错误直接打进日志，并落到工作目录供 artifact 收集
          if [ "$RC" -ne 0 ]; then
            echo "=========== 编译错误摘要 ==========="
            grep -E "error:|fatal error:" /tmp/xcodebuild_logs/build.log | sort -u | head -40
            echo "==================================="
            grep -E "error:|fatal error:" /tmp/xcodebuild_logs/build.log | sort -u > build_errors.txt
            cp /tmp/xcodebuild_logs/build.log xcodebuild_full.log
          fi
          exit $RC

      - name: 打包未签名 IPA（文件名带版本号）
        script: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP_PATH" || { echo "没有产物"; ls -R build/Build/Products | head -40; exit 1; }
          # 从 Info.plist 动态读版本号，文件名形如 PrintGate-1.1.0-unsigned.ipa
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD_NUM=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          IPA_NAME="PrintGate-${VERSION}-unsigned.ipa"
          echo "版本号 = ${VERSION} (build ${BUILD_NUM}) -> ${IPA_NAME}"
          rm -rf build/Payload "$IPA_NAME"
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/PrintGate.app"
          ( cd build && zip -qry "../$IPA_NAME" Payload )
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> "$CM_BUILD_DIR/envs.txt" 2>/dev/null || true

    artifacts:
      - PrintGate-*-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
      - build_errors.txt
      - xcodebuild_full.log
