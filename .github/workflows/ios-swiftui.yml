name: Build iOS IPA (SwiftUI)

# 原生 SwiftUI 版出包（DesignFoundation）。与 flutter-ios.yml 并存。
# 注意：当前账号 GitHub Actions 被平台禁用，此 workflow 需解封后才能用；解封前请走 Codemagic 的 ios-swiftui workflow。

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Resolve DesignFoundation (SPM)
        working-directory: ios-swiftui
        run: xcodebuild -resolvePackageDependencies -project PrintGate.xcodeproj -scheme PrintGate

      - name: Build (Release, unsigned)
        working-directory: ios-swiftui
        run: |
          xcodebuild -project PrintGate.xcodeproj -scheme PrintGate \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        working-directory: ios-swiftui
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP_PATH" || { echo "no product"; exit 1; }
          rm -rf build/Payload PrintGate-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" "build/Payload/PrintGate.app"
          ( cd build && zip -qry ../PrintGate-unsigned.ipa Payload )
          ls -lh PrintGate-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrintGate-SwiftUI-unsigned
          path: ios-swiftui/PrintGate-unsigned.ipa
          if-no-files-found: error
